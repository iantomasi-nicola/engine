<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scale test</title>
<style>:root{--bg:#fff;--ink:#1c1b1f;--mut:#625b71;--sf:#f3edf7;--ac:#6750a4;--ok:#1b6e3a;--bad:#b3261e}@media(prefers-color-scheme:dark){:root{--bg:#141218;--ink:#e6e0e9;--mut:#cac4d0;--sf:#211f26;--ac:#d0bcff;--ok:#7fd99a;--bad:#f2b8b5}}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;max-width:760px;margin-inline:auto}h1{font-size:20px;margin:0 0 4px}p{margin:6px 0;color:var(--mut)}
button{font:inherit;padding:10px 16px;border-radius:20px;border:0;background:var(--ac);color:var(--bg);margin:4px 8px 4px 0;min-height:40px}button.soft{background:var(--sf);color:var(--ink)}
.card{background:var(--sf);border-radius:16px;padding:12px 14px;margin:10px 0}.big{font-size:30px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:0;max-height:320px;overflow:auto}</style></head><body>
<h1>Scale test</h1><p>Checks that this browser can hear your Xiaomi Mi Scale 2 and shows the raw data it sends, so the format can be verified on the real device. Nothing is saved or sent anywhere.</p>
<div class="card" id="sup"></div>
<div><button id="go">Start listening</button><button class="soft" id="stop" disabled>Stop</button><button class="soft" id="copy">Copy log</button></div>
<div class="card"><div>Last reading</div><div class="big" id="w">–</div><div id="d">Step on the scale barefoot and wait until the numbers settle.</div></div>
<div class="card"><pre id="log">No frame yet.</pre></div>
<script>
/*DECODE*/
/* Mi Scale 2 (XMTZC04HM / XMTZC05HM) service data, 13 bytes, body composition service 0x181B (sources disagree on the flag bits: they are shown raw and still UNVERIFIED on this device).
   bytes 0-1 control, 2-3 year (LE), 4 month, 5 day, 6 hour, 7 minute, 8 second, 9-10 impedance (LE, ohm), 11-12 weight (LE): /200 = kg, or /100 in lb or catty units */
function decodeScale(b) {
  if (!b || b.length < 13) return null;
  const c0 = b[0], c1 = b[1], raw = b[11] | (b[12] << 8), imp = b[9] | (b[10] << 8), lbs = !!(c0 & 1), catty = !!(c0 & 0x10) && !lbs;
  const kg = lbs ? raw / 100 * 0.45359237 : catty ? raw / 100 * 0.5 : raw / 200;
  const p = n => String(n).padStart(2, "0");
  return { ctrl: [c0, c1], unit: lbs ? "lb" : catty ? "catty" : "kg", weightKg: Math.round(kg * 10) / 10, rawWeight: raw, impedance: imp,
    hasImpedance: !!(c1 & 0x02), stabilized: !!(c1 & 0x20), removed: !!(c1 & 0x80), time: `${b[2] | (b[3] << 8)}-${p(b[4])}-${p(b[5])} ${p(b[6])}:${p(b[7])}:${p(b[8])}` };
}
/*END*/
const $ = id => document.getElementById(id), UUIDS = ["0000181b-0000-1000-8000-00805f9b34fb", "0000181d-0000-1000-8000-00805f9b34fb"], hex = u => [...u].map(x => x.toString(16).padStart(2, "0")).join(" "), bin = n => n.toString(2).padStart(8, "0");
const log = []; let scan = null, onAdv = null;
const nav = typeof navigator !== "undefined" ? navigator : {}, B = nav.bluetooth;
$("sup").innerHTML = [["Secure page (https)", window.isSecureContext], ["Web Bluetooth", !!B], ["Advertisement scanning (requestLEScan)", !!B?.requestLEScan]].map(([k, v]) => `<div>${v ? "✓" : "✗"} ${k}</div>`).join("") +
  (B?.requestLEScan ? "" : `<p class="bad">Scanning is not available. On Chrome for Android open <b>chrome://flags</b>, search "Experimental Web Platform features", enable it, restart Chrome and reload this page.</p>`);
function frame(ev) {
  const sd = ev.serviceData, key = sd && UUIDS.find(u => sd.has(u)); if (!key) return;
  const v = sd.get(key), u8 = new Uint8Array(v.buffer, v.byteOffset, v.byteLength), d = decodeScale(u8), t = new Date().toLocaleTimeString();
  log.push(`${t} ${ev.device?.name || "?"} rssi ${ev.rssi} svc ${key.slice(4, 8)} len ${u8.length}\n  ${hex(u8)}${d ? `\n  ctrl ${bin(d.ctrl[0])} ${bin(d.ctrl[1])} · ${d.weightKg} kg (${d.unit}, raw ${d.rawWeight}) · impedance ${d.impedance} ohm · stabilized? ${d.stabilized} impedance flag? ${d.hasImpedance} removed? ${d.removed} · scale clock ${d.time}` : "\n  (too short to decode)"}`);
  $("log").textContent = log.slice(-40).join("\n"); if (d) { $("w").textContent = d.weightKg + " kg"; $("d").textContent = `impedance ${d.impedance} ohm · ${d.stabilized ? "stable" : "settling…"}${d.hasImpedance ? "" : " · no impedance flag"}`; }
}
$("go").onclick = async () => { try {
  if (B.requestLEScan) { scan = await B.requestLEScan({ acceptAllAdvertisements: true }); B.addEventListener("advertisementreceived", onAdv = frame); }
  else { const dev = await B.requestDevice({ filters: [{ namePrefix: "MIBFS" }, { namePrefix: "MIBCS" }, { services: [0x181b] }], optionalServices: [0x181b, 0x181d] }); dev.addEventListener("advertisementreceived", onAdv = frame); await dev.watchAdvertisements(); }
  $("go").disabled = true; $("stop").disabled = false; $("d").textContent = "Listening… step on the scale.";
} catch (e) { $("d").innerHTML = `<span class="bad">${String(e.message || e)}</span>`; } };
$("stop").onclick = () => { try { scan?.stop(); } catch (e) {} if (onAdv) { B.removeEventListener("advertisementreceived", onAdv); } $("go").disabled = false; $("stop").disabled = true; };
$("copy").onclick = async () => { try { await navigator.clipboard.writeText(log.join("\n")); $("copy").textContent = "Copied"; } catch (e) { $("copy").textContent = "Select the log and copy"; } setTimeout(() => $("copy").textContent = "Copy log", 1800); };
window.__frame = frame;
</script></body></html>
